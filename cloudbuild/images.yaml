# Builds and pushes every service image in parallel; Terraform owns deployment.
steps:
  - id: admin-panel
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/admin-panel/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/admin-panel:${_TAG}', '.']
  - id: api
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/api/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/api:${_TAG}', '.']
  - id: ingestion
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/ingestion/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/ingestion:${_TAG}', '.']
  - id: rules
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/rules/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/rules:${_TAG}', '.']
  - id: agent
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/agent/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/agent:${_TAG}', '.']
  - id: voice
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/voice/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/voice:${_TAG}', '.']
  - id: email
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/email/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/email:${_TAG}', '.']
  - id: browser
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'services/browser/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/browser:${_TAG}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/admin-panel:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/api:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/ingestion:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/rules:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/agent:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/voice:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/email:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/browser:${_TAG}'
substitutions:
  _REGION: europe-west1
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
