steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'landing/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/landing:${_TAG}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/propadmin/landing:${_TAG}'
substitutions:
  _REGION: europe-west1
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
