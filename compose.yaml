  browser:
    build:
      context: .
      dockerfile: services/browser/Dockerfile
    environment:
      PORT: '8080'
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      PROPADMIN_MODE: local
      PROPADMIN_DATA_PATH: /data/state.json
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-propadmin-local}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-signing-key}
      PUBLIC_API_URL: http://api:8080
      RULES_SERVICE_URL: http://rules:8080
      AGENT_SERVICE_URL: http://agent:8080
      VOICE_SERVICE_URL: http://voice:8080
      EMAIL_SERVICE_URL: http://email:8080
