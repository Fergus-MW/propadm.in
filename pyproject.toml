[project]
name = "propadmin"
version = "0.1.0"
description = "Property operations knowledge graph and autonomous workflows"
requires-python = ">=3.12"
dependencies = [
  "propadmin-core", "propadmin-runtime", "fastapi>=0.115,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
cloud = ["google-cloud-secret-manager>=2,<3", "google-cloud-tasks>=2,<3", "google-cloud-storage>=3,<4", "google-auth>=2,<3", "google-cloud-logging>=3.12,<4"]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/runtime", "services/api", "services/ingestion", "services/rules", "services/agent", "services/voice", "services/email", "services/browser"]

[tool.uv.sources]
propadmin-core = { workspace = true }
propadmin-runtime = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/core/tests", "infra/tests"]
pythonpath = [".", "packages/core/src", "packages/runtime/src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["propadmin-design-system"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
